server.port=8081
spring.application.name=EventNexus

# Swagger / OpenAPI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui

# PostgreSQL Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/eventnexus}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:password}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# AI Configuration (Placeholder)
spring.ai.vertex.ai.gemini.project-id=${SPRING_AI_VERTEX_AI_GEMINI_PROJECT_ID:YOUR_PROJECT_ID}
spring.ai.vertex.ai.gemini.location=${SPRING_AI_VERTEX_AI_GEMINI_LOCATION:us-central1}
